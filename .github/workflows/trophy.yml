name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite UTC
  workflow_dispatch: {}    # permite rodar manualmente

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar SVG dos troféus
        run: |
          mkdir -p dist
          curl -sSL --retry 5 --retry-delay 15 \
            "https://github-profile-trophy.vercel.app/?username=FelipeShai&theme=radical&no-frame=true&row=1&column=6" \
            -o dist/trophy.svg

      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy SVG"
          git push
